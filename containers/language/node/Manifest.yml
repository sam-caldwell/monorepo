---
header:
  author: Sam Caldwell
  email: mail@samcaldwell.net
  publish: "public"
  description: |
    Node.js container images with nvm, npm, and yarn.
    Includes Node 20 (LTS), 21, and latest.
    builder: Ubuntu + nvm + all Node versions
    runtime: distroless + Node
  opsys:
    - any
  arch:
    - any
  dependencies:
    - containers/opsys
clean:
  enabled: true
  steps:
    - enabled: true
      continueOnError: true
      command: "docker rmi -f language/node:builder"
    - enabled: true
      continueOnError: true
      command: "docker rmi -f language/node:runtime"
build:
  enabled: true
  steps:
    - enabled: true
      continueOnError: false
      command: |
        docker build --compress --target builder --tag language/node:builder --file containers/language/node/Dockerfile .
    - enabled: true
      continueOnError: false
      command: |
        docker build --compress --target runtime --tag language/node:runtime --file containers/language/node/Dockerfile .
test:
  comment: "ToDo: Add tests for the container images"
  enabled: false
