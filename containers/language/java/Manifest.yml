---
header:
  author: Sam Caldwell
  email: mail@samcaldwell.net
  publish: "public"
  description: |
    Java 21 container images.
    builder: Ubuntu + OpenJDK 21 (full JDK)
    runtime: distroless + minimal JRE via jlink
  opsys:
    - any
  arch:
    - any
  dependencies:
    - containers/opsys
clean:
  enabled: true
  steps:
    - enabled: true
      continueOnError: true
      command: "docker rmi -f language/java:21-builder"
    - enabled: true
      continueOnError: true
      command: "docker rmi -f language/java:21-runtime"
build:
  enabled: true
  steps:
    - enabled: true
      continueOnError: false
      command: |
        docker build --compress --target builder --tag language/java:21-builder --file containers/language/java/21/Dockerfile .
    - enabled: true
      continueOnError: false
      command: |
        docker build --compress --target runtime --tag language/java:21-runtime --file containers/language/java/21/Dockerfile .
test:
  comment: "ToDo: Add tests for the container images"
  enabled: false
