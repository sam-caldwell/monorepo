---
header:
  author: Sam Caldwell
  email: mail@samcaldwell.net
  publish: "public"
  description: |
    Python container images with pip3 and venv.
    Includes Python 3.14 and latest stable.
    builder: Ubuntu + Python from source
    runtime: distroless + Python
  opsys:
    - any
  arch:
    - any
  dependencies:
    - containers/opsys
clean:
  enabled: true
  steps:
    - enabled: true
      continueOnError: true
      command: "docker rmi -f language/python:builder"
    - enabled: true
      continueOnError: true
      command: "docker rmi -f language/python:runtime"
build:
  enabled: true
  steps:
    - enabled: true
      continueOnError: false
      command: |
        docker build --compress --target builder --tag language/python:builder --file containers/language/python/Dockerfile .
    - enabled: true
      continueOnError: false
      command: |
        docker build --compress --target runtime --tag language/python:runtime --file containers/language/python/Dockerfile .
test:
  comment: "ToDo: Add tests for the container images"
  enabled: false
